name: R-CMD-check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    env:
      # Read the private settylab/ccflowR Remote during pak dependency resolution.
      GITHUB_PAT: ${{ secrets.SETTYLAB_CI_PAT }}
    strategy:
      fail-fast: false
      matrix:
        # R >= 4.3 only: the package needs SeuratObject (>= 5.0.0), which pulls
        # Matrix (>= 1.6.4) requiring R >= 4.4 — R 4.2 cannot solve the graph.
        os: [ubuntu-latest, macos-latest, windows-latest]
        r-version: ['4.3', '4.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'

  test-coverage:
    runs-on: ubuntu-latest
    needs: R-CMD-check
    env:
      # Read the private settylab/ccflowR Remote during pak dependency resolution.
      GITHUB_PAT: ${{ secrets.SETTYLAB_CI_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        run: |
          covr::codecov(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
        shell: Rscript {0}

  lint:
    runs-on: ubuntu-latest
    env:
      # Read the private settylab/ccflowR Remote during pak dependency resolution.
      GITHUB_PAT: ${{ secrets.SETTYLAB_CI_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
