name: R-CMD-check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    env:
      # ccflowR is a private, optional Suggests that CI cannot clone. All
      # ccflowR usage is guarded (requireNamespace / \dontrun / skipped tests),
      # so treat unavailable Suggests as NOTEs rather than failing the check.
      _R_CHECK_FORCE_SUGGESTS_: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r-version: ['4.2', '4.3', '4.4']
        exclude:
          # Reduce matrix size
          - os: macos-latest
            r-version: '4.2'
          - os: windows-latest
            r-version: '4.2'

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Setup R dependencies
        # Install hard deps + the public packages the check actually exercises.
        # dependencies: '"hard"' (not "all") so pak does not try to clone the
        # private settylab/ccflowR Suggests (no Remote -> unresolvable in CI).
        # Suggests that skip in CI (nichenetr/multinichenetr need local data)
        # are intentionally omitted; ccflowR is namespace-guarded everywhere.
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # No `needs: check` — that pulls Suggests (incl. the private,
          # unresolvable ccflowR) into the solve. dependencies: '"hard"' +
          # explicit rcmdcheck/testthat installs exactly what the check needs.
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'

  test-coverage:
    runs-on: ubuntu-latest
    needs: R-CMD-check
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::covr
            any::testthat

      - name: Test coverage
        run: |
          covr::codecov(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
        shell: Rscript {0}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::lintr
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
